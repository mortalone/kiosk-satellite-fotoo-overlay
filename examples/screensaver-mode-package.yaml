# HA package: one chooser for Nature Frame / Wall Art and Fotoo.
# Install Quick Actions & Clock 0.2.8 and expose its actions to Home Assistant.
# The prefix below matches Jacob's existing Kiosk entities. Change it once if
# this package is used on a different kiosk. Commands are resolved by their
# built-in English titles, so auto-generated button entity IDs need not be guessed.
# Keep the plugin button names unchanged, or replace the matching templates.

input_select:
  raspberry_screensaver_source:
    name: Raspberry billedvisning
    icon: mdi:image-multiple
    options:
      - Nature Frame
      - Fotoo

script:
  raspberry_apply_art_source:
    alias: Raspberry – vælg billedvisning
    mode: restart
    fields:
      source:
        name: Billedvisning
        required: true
        selector:
          select:
            options: [Nature Frame, Fotoo]
    variables:
      kiosk_prefix: raspberry_raspberry_pi_4
      wall_art_button: >-
        {{ states.button | selectattr('entity_id', 'match', '^button\\.' ~ kiosk_prefix ~ '_')
           | selectattr('name', 'search', 'Show Wall Art now$')
           | map(attribute='entity_id') | first | default('') }}
      combined_fotoo_button: >-
        {{ states.button | selectattr('entity_id', 'match', '^button\\.' ~ kiosk_prefix ~ '_')
           | selectattr('name', 'search', 'Open Fotoo with overlay$')
           | map(attribute='entity_id') | first | default('') }}
      quick_fotoo_button: >-
        {{ states.button | selectattr('entity_id', 'match', '^button\\.' ~ kiosk_prefix ~ '_')
           | selectattr('name', 'search', 'Open Fotoo with Quick Actions$')
           | map(attribute='entity_id') | first | default('') }}
      now_playing_fotoo_button: >-
        {{ states.button | selectattr('entity_id', 'match', '^button\\.' ~ kiosk_prefix ~ '_')
           | selectattr('name', 'search', 'Open Fotoo with Now Playing$')
           | map(attribute='entity_id') | first | default('') }}
      attach_fotoo_button: >-
        {{ states.button | selectattr('entity_id', 'match', '^button\\.' ~ kiosk_prefix ~ '_')
           | selectattr('name', 'search', 'Attach Quick Actions to Fotoo$')
           | map(attribute='entity_id') | first | default('') }}
    sequence:
      - choose:
          - conditions: "{{ source == 'Nature Frame' }}"
            sequence:
              - if: "{{ not wall_art_button }}"
                then:
                  - stop: "Install/enable Quick Actions & Clock 0.2.8 and expose Show Wall Art now to HA."
                    error: true
              - action: select.select_option
                target:
                  entity_id: "{{ 'select.' ~ kiosk_prefix ~ '_screensaver_mode' }}"
                data:
                  option: Home Assistant Media
              - action: switch.turn_on
                target:
                  entity_id:
                    - "{{ 'switch.' ~ kiosk_prefix ~ '_keep_screen_on' }}"
                    - "{{ 'switch.' ~ kiosk_prefix ~ '_screensaver' }}"
              - action: button.press
                target:
                  entity_id: "{{ wall_art_button }}"
          - conditions: "{{ source == 'Fotoo' }}"
            sequence:
              - variables:
                  open_button: "{{ combined_fotoo_button or now_playing_fotoo_button or quick_fotoo_button }}"
              - if: "{{ not open_button or not attach_fotoo_button }}"
                then:
                  - stop: "Install/enable Quick Actions & Clock 0.2.8 and expose its Fotoo buttons to HA."
                    error: true
              # Prevent Android Fotoo and Kiosk's own idle timer racing.
              - action: switch.turn_off
                target:
                  entity_id:
                    - "{{ 'switch.' ~ kiosk_prefix ~ '_screensaver' }}"
                    - "{{ 'switch.' ~ kiosk_prefix ~ '_keep_screen_on' }}"
              # Preserve the existing Now Playing/doorbell Fotoo owner if present.
              - action: button.press
                target:
                  entity_id: "{{ open_button }}"
              - action: button.press
                target:
                  entity_id: "{{ attach_fotoo_button }}"
        default:
          - stop: "source must be Nature Frame or Fotoo"
            error: true

  raspberry_toggle_art_source:
    alias: Raspberry – skift mellem Wall Art og Fotoo
    mode: single
    sequence:
      - action: input_select.select_next
        target:
          entity_id: input_select.raspberry_screensaver_source
        data:
          cycle: true

automation:
  - alias: Raspberry billedvisning
    id: raspberry_screensaver_source
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.raspberry_screensaver_source
        to:
          - Nature Frame
          - Fotoo
    actions:
      - action: script.raspberry_apply_art_source
        data:
          source: "{{ trigger.to_state.state }}"
