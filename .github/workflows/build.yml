name: Build and release plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Test shared overlay visibility rules
        run: |
          mkdir -p /tmp/overlay-policy-test
          javac -d /tmp/overlay-policy-test plugins/quick-actions-overlay/src/me/jxl/kiosk/plugins/quickactionsoverlay/OverlayVisibility.java tests/OverlayVisibilityTest.java
          java -cp /tmp/overlay-policy-test me.jxl.kiosk.plugins.quickactionsoverlay.OverlayVisibilityTest
      - name: Install Android platform and D8
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build compatibility plugin and standalone plugins
        run: |
          python3 tools/build.py --android-platform 35
          for project in plugins/*; do
            if [ -f "$project/kiosk-satellite-plugin.json" ]; then
              python3 tools/build.py --android-platform 35 --project "$project"
            fi
          done
      - name: Read version
        id: version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("kiosk-satellite-plugin.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/fotoo-system-overlay-poc-$VERSION.zip" >> "$GITHUB_OUTPUT"
      - name: Upload developer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screensaver-overlay-suite
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: Publish stable GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            dist/*.zip \
            dist/*.zip.sha256 \
            "kiosk-satellite-plugin.json" \
            --target "$GITHUB_SHA" \
            --title "Screensaver Overlay Suite $VERSION" \
            --notes-file RELEASE_NOTES.md
