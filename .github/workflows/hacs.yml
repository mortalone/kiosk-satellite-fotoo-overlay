name: HACS validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Repository topics are only required for inclusion in HACS' default
          # catalogue. Nature Frame is installed as a custom repository.
          ignore: topics
